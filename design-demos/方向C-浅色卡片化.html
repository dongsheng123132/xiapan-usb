<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方向 C · 浅色卡片化 — 虾盘随身 AI</title>
<style>
  :root{
    --canvas:#EEF1F5; --surface:#FFFFFF; --surface2:#F7F9FC;
    --navy:#16324F; --navy-2:#1F4268; --red:#C0392B;
    --label:#1B2A3A; --label2:#5A6B7B; --label3:#93A1AE;
    --sep:#E2E8F0; --sep-strong:#CBD5E0;
    --accent:#1261C2; --accent-soft:#EAF2FB;
    --green:#1E9E58; --orange:#C77C11;
    --radius:12px; --shadow:0 1px 2px rgba(22,50,79,.06),0 10px 30px rgba(22,50,79,.07);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--label);background:var(--canvas);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .app{display:flex;flex-direction:column;height:100vh}

  /* 题头：深蓝 + 红标线 */
  .header{background:var(--navy);color:#fff;position:relative}
  .header::before{content:"";display:block;height:3px;background:var(--red)}
  .header-in{max-width:1200px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:14px}
  .header .brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600}
  .header .brand-mark{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:16px}
  .header .sub{font-size:12px;color:rgba(255,255,255,.72);font-weight:400}
  .header .acts{margin-left:auto;display:flex;gap:8px}
  .hbtn{height:34px;padding:0 14px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;font-size:13px;cursor:pointer}
  .hbtn:hover{background:rgba(255,255,255,.12)}
  .hbtn.solid{background:#fff;color:var(--navy);border-color:#fff;font-weight:600}

  .body{flex:1;overflow-y:auto;max-width:1200px;width:100%;margin:0 auto;padding:22px 24px 28px}
  .grid{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
  @media(max-width:860px){.grid{grid-template-columns:1fr}}

  .card{background:var(--surface);border:1px solid var(--sep);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card-head{padding:15px 18px;border-bottom:1px solid var(--sep);display:flex;align-items:center;gap:10px}
  .card-head h3{margin:0;font-size:15px;font-weight:600}
  .card-head .hint{margin-left:auto;font-size:12px;color:var(--label3)}
  .card-body{padding:16px 18px}

  /* 对话卡片 */
  .thread{display:flex;flex-direction:column;gap:12px;min-height:300px}
  .bubble{max-width:82%;padding:11px 14px;border-radius:12px;font-size:14.5px;background:var(--surface2);border:1px solid var(--sep)}
  .bubble.user{align-self:flex-end;background:var(--accent);color:#fff;border-color:transparent}
  .composer{margin-top:14px;display:flex;gap:8px;background:var(--surface2);border:1px solid var(--sep);border-radius:10px;padding:8px 8px 8px 14px}
  textarea{flex:1;border:none;outline:none;resize:none;background:transparent;font:inherit;font-size:14.5px;max-height:100px;padding:5px 0}
  .send{height:36px;padding:0 18px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer}

  /* 右侧快速动作卡片 */
  .side{display:flex;flex-direction:column;gap:16px}
  .qa{display:flex;align-items:center;gap:12px;padding:13px 15px;border:1px solid var(--sep);border-radius:10px;background:var(--surface2);cursor:pointer;transition:transform .12s}
  .qa:hover{transform:translateY(-1px);border-color:var(--sep-strong)}
  .qa .ic{width:36px;height:36px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
  .qa .ic svg{width:18px;height:18px}
  .qa .t{font-size:14px;font-weight:600}
  .qa .d{font-size:12px;color:var(--label2);margin-top:1px}
  .qa .arr{margin-left:auto;color:var(--label3);font-size:16px}
  .fold{display:flex;align-items:center;gap:12px;padding:13px 15px;border:1px dashed var(--sep-strong);border-radius:10px;background:transparent;color:var(--label2);font-size:13px}

  .meta-row{display:flex;gap:20px;margin-top:18px;font-size:12.5px;color:var(--label2)}
  .meta-row b{color:var(--label);font-weight:600}
  .tag{position:fixed;right:16px;bottom:16px;font-size:12px;color:var(--label2);background:rgba(255,255,255,.95);
    border:1px solid var(--sep);padding:6px 12px;border-radius:99px}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="header-in">
      <div class="brand"><span class="brand-mark">虾</span>虾盘 · 随身 AI<div class="sub">随盘办公搭子 · 电脑维护工具包</div></div>
      <div class="acts">
        <button class="hbtn">维护工具包</button>
        <button class="hbtn">完整 PicoClaw</button>
        <button class="hbtn solid">退出</button>
      </div>
    </div>
  </header>

  <div class="body">
    <div class="grid">
      <!-- 左：对话 -->
      <section class="card">
        <div class="card-head"><h3>AI 对话</h3><span class="hint">PicoClaw 运行中 · 设置随盘保存</span></div>
        <div class="card-body">
          <div class="thread">
            <div class="bubble ai">你好。想接着上次的活，还是查一下这台电脑？文件都放在右侧「文件夹」里。</div>
            <div class="bubble user">把项目A的会议纪要按日期排一下。</div>
            <div class="bubble ai">已整理并写回盘内「项目A / 整理」文件夹，共 3 份。</div>
          </div>
          <div class="composer">
            <textarea rows="1" placeholder="想聊什么，或需要我帮什么忙？"></textarea>
            <button class="send">发送</button>
          </div>
        </div>
      </section>

      <!-- 右：快速动作 -->
      <div class="side">
        <div class="qa"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6.5" width="18" height="11" rx="2.4"/><path d="M3 10h18M15.5 13.5h1.6"/></svg></span><span><div class="t">钱包 · 充值</div><div class="d">虾盘云额度 / 自带 API</div></span><span class="arr">›</span></div>
        <div class="qa"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.7a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.5a7 7 0 0 0 0 2.4l-2 1.5 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.7a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.5a7 7 0 0 0 .1-1.2z"/></svg></span><span><div class="t">模型设置</div><div class="d">选择 AI 服务与模型</div></span><span class="arr">›</span></div>
        <div class="qa"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14.7 6.3a5 5 0 0 0-6.4 6.4L4 16.9 6.5 19.4l4.2-4.3a5 5 0 0 0 6.4-6.4L13.7 12 12 10.3z"/></svg></span><span><div class="t">维护工具包</div><div class="d">断网应急 · 系统体检</div></span><span class="arr">›</span></div>
        <div class="fold">
          <span style="font-size:18px">＋</span> 文件夹（工作区）—— 拖入文件，随盘带走
        </div>
        <div class="meta-row">
          <span><b>3</b> 个文件</span><span><b>20.8 KB</b> 已用</span><span>随盘保存</span>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="tag">方向 C · 浅色卡片化（政企熟路）· 视觉预览</div>
</body>
</html>
