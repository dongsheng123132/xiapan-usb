<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="title desc">
  <title id="title">Xiapan USB Toolkit</title>
  <desc id="desc">A portable cartridge brings diagnostics, utilities and optional AI through one maintenance core. Subtle light and diagnostic pulses animate across a forest-green canvas.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#081613"/><stop offset=".53" stop-color="#112c25"/><stop offset="1" stop-color="#102429"/></linearGradient>
    <linearGradient id="titleColor" x2="1" y2="0"><stop stop-color="#d1f99a"/><stop offset="1" stop-color="#81e6c3"/></linearGradient>
    <linearGradient id="case" x2="0" y2="1"><stop stop-color="#29453b"/><stop offset="1" stop-color="#102720"/></linearGradient>
    <linearGradient id="beam"><stop stop-color="#a3efb3" stop-opacity="0"/><stop offset=".5" stop-color="#a3efb3" stop-opacity=".05"/><stop offset="1" stop-color="#a3efb3" stop-opacity="0"/></linearGradient>
    <radialGradient id="haze"><stop stop-color="#8ad6a1" stop-opacity=".13"/><stop offset="1" stop-color="#8ad6a1" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="soft"/><feMerge><feMergeNode in="soft"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="canvas"><rect width="1280" height="380" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#canvas)">
    <rect width="1280" height="380" fill="url(#background)"/>
    <ellipse cx="992" cy="190" rx="290" ry="215" fill="url(#haze)"/>
    <path d="M0 332H1280M720 0V380" stroke="#96c7b3" stroke-opacity=".06"/>
    <rect x="-220" y="0" width="180" height="380" fill="url(#beam)">
      <animate attributeName="x" from="-220" to="1400" dur="18s" repeatCount="indefinite"/>
    </rect>
    <g id="particles" fill="#a4dcc0" opacity=".42">
      <circle cx="28" cy="65" r="1.5"><animate attributeName="opacity" values=".25;.7;.25" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="173" cy="35" r="1"/><circle cx="286" cy="61" r="1.2"/><circle cx="417" cy="26" r="1.6"/>
      <circle cx="556" cy="72" r="1"/><circle cx="686" cy="37" r="1.5"><animate attributeName="opacity" values=".7;.2;.7" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="812" cy="56" r="1"/><circle cx="957" cy="30" r="1.5"/><circle cx="1126" cy="61" r="1.2"/><circle cx="1236" cy="27" r="1.5"/>
      <circle cx="27" cy="211" r="1"/><circle cx="116" cy="327" r="1.3"/><circle cx="241" cy="358" r="1.6"/><circle cx="384" cy="320" r="1.1"/>
      <circle cx="523" cy="352" r="1.5"><animate attributeName="opacity" values=".3;.8;.3" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="649" cy="323" r="1"/><circle cx="761" cy="355" r="1.4"/><circle cx="905" cy="334" r="1"/><circle cx="1067" cy="354" r="1.6"/><circle cx="1232" cy="313" r="1.2"/>
      <circle cx="754" cy="161" r="1.4"/><circle cx="1221" cy="183" r="1.5"><animate attributeName="opacity" values=".3;.9;.3" dur="6s" repeatCount="indefinite"/></circle>
    </g>
    <g font-family="Inter,Segoe UI,Arial,sans-serif">
      <text x="66" y="75" font-size="13" font-weight="600" letter-spacing="3" fill="#91b9a8">OPEN SOURCE · PORTABLE MAINTENANCE</text>
      <text x="62" y="155" font-size="68" font-weight="750" letter-spacing="-2" fill="#f0f6ef">Xiapan</text>
      <text x="62" y="222" font-size="61" font-weight="750" letter-spacing="-2" fill="url(#titleColor)">USB Toolkit</text>
      <text x="66" y="269" font-size="21" fill="#b7cdbf">Portable tools. Optional AI.</text>
      <line x1="67" y1="291" x2="327" y2="291" stroke="#b6ed92" stroke-width="2" stroke-dasharray="260" stroke-dashoffset="0">
        <animate attributeName="stroke-dashoffset" values="260;0;0;260" keyTimes="0;.28;.82;1" dur="12s" repeatCount="indefinite"/>
      </line>
      <text x="66" y="324" font-size="13" letter-spacing="1" fill="#8aaa9a">YOUR DRIVE   /   YOUR TOOLS   /   YOUR API KEY</text>
    </g>
    <g id="portable-cartridge" transform="translate(988,190)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="9s" repeatCount="indefinite"/>
        <path d="M-184 -44H-132V44H-184Z" fill="#193b31" stroke="#88b5a0" stroke-width="6" stroke-linejoin="round"/>
        <path d="M-169 -20H-150M-169 20H-150" stroke="#c9f29f" stroke-width="7"/>
        <path d="M-128 -85H141Q169 -85 169 -57V57Q169 85 141 85H-128Z" fill="url(#case)" stroke="#b5e991" stroke-width="7" stroke-linejoin="round"/>
        <path d="M-108 -62H128Q145 -62 145 -45V45Q145 62 128 62H-108" fill="none" stroke="#598c74" stroke-width="2"/>
        <path d="M-97 0H-56M-12 0H24M68 0H108" stroke="#80c5a8" stroke-width="6"/>
        <rect x="-72" y="-28" width="54" height="56" rx="10" fill="#163a2e" stroke="#a2e18f" stroke-width="5"/>
        <path d="M-63 1H-54L-48 -12L-40 15L-33 0H-26" fill="none" stroke="#defac1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="28" y="-28" width="54" height="56" rx="10" fill="#143830" stroke="#71cfb5" stroke-width="5"/>
        <path d="M42 -10H66M42 1H66M42 12H57" stroke="#b9eee0" stroke-width="4" stroke-linecap="round"/>
        <circle cx="116" cy="0" r="7" fill="#c4f49a" filter="url(#glow)"><animate attributeName="opacity" values=".45;1;.45" dur="4s" repeatCount="indefinite"/></circle>
        <path d="M-101 108H22L37 94H132" fill="none" stroke="#629c83" stroke-width="3"/>
        <circle cx="-101" cy="108" r="5" fill="#8ccea5"/>
        <text x="-107" y="-110" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="2" fill="#9bc6ae">ONE MAINTENANCE CORE</text>
      </g>
    </g>
  </g>
</svg>
